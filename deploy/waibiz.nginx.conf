server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name waibiz.nz www.waibiz.nz;

    root /var/www/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/waibiz.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waibiz.nz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/wasm image/svg+xml;

    location = / {
        try_files /index.html =404;
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|wasm|webp|jpg|jpeg|png|svg)$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name waibiz.nz www.waibiz.nz;
    return 301 https://$host$request_uri;
}
