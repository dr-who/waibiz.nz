[package]
name = "waibiz-nz"
version = "0.1.0"
edition = "2021"

[dependencies]
console_error_panic_hook = "0.1"
leptos = { version = "0.8.20", features = ["csr"] }
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "CanvasGradient",
  "CanvasRenderingContext2d",
  "Document",
  "DomRect",
  "Element",
  "EventTarget",
  "HtmlCanvasElement",
  "MediaQueryList",
  "PointerEvent",
  "Window",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
